[build]
builder = "NIXPACKS"
buildCommand = "npx -y pnpm@11.9.0 turbo build --filter=@kritva/api"
watchPatterns = ["packages/api/**", "packages/db/**", "packages/types/**", "packages/notifications/**", "packages/payments/**"]

[deploy]
startCommand = "node packages/api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
HUSKY = "0"
NODE_ENV = "production"
