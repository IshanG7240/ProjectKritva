packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Pin a few packages whose freshest releases are still inside the global
# minimum-release-age supply-chain cutoff. Re-evaluate periodically.
overrides:
  "zod": "3.25.76"
  "@typescript-eslint/eslint-plugin": "8.61.0"
  "@typescript-eslint/parser": "8.61.0"
  "@typescript-eslint/project-service": "8.61.0"
  "@typescript-eslint/scope-manager": "8.61.0"
  "@typescript-eslint/tsconfig-utils": "8.61.0"
  "@typescript-eslint/type-utils": "8.61.0"
  "@typescript-eslint/types": "8.61.0"
  "@typescript-eslint/typescript-estree": "8.61.0"
  "@typescript-eslint/utils": "8.61.0"
  "@typescript-eslint/visitor-keys": "8.61.0"
  "typescript-eslint": "8.61.0"
  "es-to-primitive": "1.3.0"

# Explicit allowlist of packages permitted to run install scripts. Sharp
# downloads platform-specific binaries at install time; @kritva/api uses it
# for image resizing (T-014).
onlyBuiltDependencies:
  - sharp

# Per-package build approvals (pnpm 11 supply-chain audit).
allowBuilds:
  esbuild: true
  sharp: true
